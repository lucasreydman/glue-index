name: Nightly GLUE

on:
  schedule:
    # 09:15 UTC is 4:15am ET in winter and 5:15am ET in summer, after the West Coast games end.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The scripts below run on Node alone and install nothing. Without this,
          # setup-node v5 sees `packageManager: pnpm` in package.json, tries to
          # cache pnpm's store, and fails because pnpm is not on the runner.
          package-manager-cache: false
      - name: Pull last night from pbpstats
        run: node scripts/fetch.ts nightly
      - name: Check that everything still scores
        run: node scripts/build-data.ts
      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: nightly pull $(date -u +%F)"
            git push
          fi
